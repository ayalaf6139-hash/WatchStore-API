name: Generate WatchFlow migration

on:
  push:
    branches: ["watchflow-phase1"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=unused;Username=postgres;Password=postgres
      Jwt__Key: ci-only-signing-key-not-a-secret-0123456789

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Generate migration if the model changed
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.20
          dotnet build WatchStore.sln -c Release
          if dotnet ef migrations has-pending-model-changes --project WatchStore.Data --startup-project WatchStore.API --configuration Release --no-build; then
            echo "::notice title=Migration::Model is already in sync. Nothing to generate."
            exit 0
          fi
          dotnet ef migrations add AddWatchFlowDomain --project WatchStore.Data --startup-project WatchStore.API --configuration Release --no-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WatchStore.Data/Migrations
          git commit -m "Add AddWatchFlowDomain migration (generated by dotnet ef)"
          git push
          echo "::notice title=Migration::AddWatchFlowDomain generated and pushed."
