databases:
  - name: watchstore-db
    plan: free
    databaseName: watchstore
    user: watchstore

services:
  - type: web
    name: watchstore-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /swagger/index.html
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: watchstore-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Swagger__Enabled
        value: "true"
